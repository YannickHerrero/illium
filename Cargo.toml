[workspace]
members = ["crates/winarchy-ipc", "crates/winarchyctl"]
default-members = [".", "crates/winarchy-ipc", "crates/winarchyctl"]
resolver = "3"

[package]
name = "winarchy"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
winarchy-ipc = { path = "crates/winarchy-ipc" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.12.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

[build-dependencies]
slint-build = "=1.12.1"

[profile.release]
strip = true
