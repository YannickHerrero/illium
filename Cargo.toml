[workspace]
members = ["crates/winarchy-ipc", "crates/winarchy-theme", "crates/winarchyctl", "crates/winarchy-apps", "crates/winarchy-terminal"]
default-members = [".", "crates/winarchy-ipc", "crates/winarchy-theme", "crates/winarchyctl", "crates/winarchy-apps", "crates/winarchy-terminal"]
resolver = "3"

[package]
name = "winarchy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keyboard-first tiling window manager and experimental shell for Windows 11"
repository = "https://github.com/YannickHerrero/winarchy"
build = "build.rs"

[dependencies]
winarchy-ipc = { path = "crates/winarchy-ipc" }
winarchy-theme = { path = "crates/winarchy-theme" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Keybinding edits rewrite the user's file in place, keeping comments and order.
toml_edit = "0.22"
serde_json = "1"
# Theme-picker raster preparation is pure Rust and tested without a desktop.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.12.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"
# Applet views are compiled at run time; `internal`/`internal-json` expose the
# typed JSON conversion. i-slint-core's `svg` feature enables run-time SVG
# decoding for applet views and the shell's embedded icons.
slint-interpreter = { version = "=1.12.1", default-features = false, features = ["std", "compat-1-2", "internal", "internal-json"] }
i-slint-core = { version = "=1.12.1", default-features = false, features = ["std", "svg"] }
# Only to walk the declared type of an applet view's `data` property.
i-slint-compiler = { version = "=1.12.1", default-features = false }
spin_on = "0.1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
# Direct dependency only for the `interface` macro declaring IPolicyConfig.
windows-core = "0.61"

[build-dependencies]
slint-build = "=1.12.1"
winresource = "0.1"

[profile.release]
strip = true
