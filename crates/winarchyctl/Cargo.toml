[package]
name = "winarchyctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line controller for the Winarchy window manager"
repository = "https://github.com/YannickHerrero/winarchy"

[dependencies]
winarchy = { path = "../.." }
serde_json = "1"
argon2 = "0.6"
rpassword = "7.5.4"
winarchy-ipc = { path = "../winarchy-ipc" }
winarchy-theme = { path = "../winarchy-theme" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"
