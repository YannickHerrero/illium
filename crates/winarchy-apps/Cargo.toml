[package]
name = "winarchy-apps"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Companion applications of the Winarchy window manager in one executable"
repository = "https://github.com/YannickHerrero/winarchy"
build = "build.rs"

[dependencies]
winarchy-theme = { path = "../winarchy-theme" }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.12.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry"] }

[build-dependencies]
slint-build = "=1.12.1"
winresource = "0.1"
