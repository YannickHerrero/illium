[package]
name = "winarchy-apps"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Companion applications of the Winarchy window manager in one executable"
repository = "https://github.com/YannickHerrero/winarchy"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory"] }

[build-dependencies]
winresource = "0.1"
