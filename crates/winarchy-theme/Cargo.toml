[package]
name = "winarchy-theme"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Theme files shared by the Winarchy daemon and its applications"
repository = "https://github.com/YannickHerrero/winarchy"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
