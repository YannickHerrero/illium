[package]
name = "winarchy-theme"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Theme files shared by the Winarchy daemon and its applications"
repository = "https://github.com/YannickHerrero/winarchy"

[features]
default = ["assets"]
assets = ["dep:image", "dep:fast_image_resize"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
fast_image_resize = { version = "6.1", optional = true, default-features = false, features = ["std", "only_u8x4"] }

[[example]]
name = "profile_wallpaper"
required-features = ["assets"]
