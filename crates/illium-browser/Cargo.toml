[package]
name = "illium-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal WebView2 browser with native ad filtering"

[dependencies]
adblock = "=0.13.3"
url = "2"
tempfile = "3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
illium-theme = { path = "../illium-theme", default-features = false, features = ["live"] }

illium-ipc = { path = "../illium-ipc" }

[build-dependencies]
slint-build = "=1.12.1"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.12.1", default-features = false, features = ["std", "renderer-software", "compat-1-2", "software-renderer-systemfonts"] }
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
