[package]
name = "winarchy-ipc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Named-pipe command protocol shared by Winarchy and its controller"
repository = "https://github.com/YannickHerrero/winarchy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
