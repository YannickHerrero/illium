[package]
name = "winarchy-screensaver"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lock screensaver: a native port of the TerminalTextEffects engine and effects, rendered to a pixel buffer"
repository = "https://github.com/YannickHerrero/winarchy"

[dependencies]
winarchy-config = { path = "../winarchy-config" }
fontdue = { version = "0.9", default-features = false, features = ["simd", "hashbrown"] }

[dev-dependencies]
png = "0.17"
