name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all --check
      - run: python scripts/check-cli-dependencies.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/winarchy
          Copy-Item target/release/winarchy.exe,target/release/winarchyctl.exe,target/release/winarchy-shot.exe,README.md,LICENSE dist/winarchy
          Copy-Item -Recurse config,docs dist/winarchy
          Compress-Archive dist/winarchy/* dist/winarchy-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winarchy-windows-x64
          path: dist/winarchy-windows-x64.zip
