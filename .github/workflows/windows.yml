name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/winarchy
          Copy-Item target/release/winarchy.exe,target/release/winarchyctl.exe,README.md,LICENSE dist/winarchy
          Copy-Item -Recurse config,docs dist/winarchy
          Compress-Archive dist/winarchy/* dist/winarchy-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: winarchy-windows-x64
          path: dist/winarchy-windows-x64.zip
