name: Windows
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all --check
      - run: python scripts/check-cli-dependencies.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/illium
          Copy-Item target/release/illium.exe,target/release/illiumctl.exe,target/release/illium-apps.exe,target/release/illium-terminal.exe,target/release/illium-dictate.exe,target/release/illium-browser.exe,README.md,LICENSE dist/illium
          Copy-Item -Recurse config,docs dist/illium
          New-Item -ItemType Directory dist/illium/scripts
          Copy-Item scripts/update-browser-filters.ps1,scripts/measure-browser.ps1 dist/illium/scripts
          Compress-Archive dist/illium/* dist/illium-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: illium-windows-x64
          path: dist/illium-windows-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dependencies, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: illium-windows-x64
      - run: sha256sum illium-windows-x64.zip > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" illium-windows-x64.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
